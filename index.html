<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Brand.UP — Freelance Branding & Art Direction</title>
  <meta name="description" content="Brand.UP is looking for freelance branding and art direction experts. 100% remote, end-to-end brand projects.">
  <meta property="og:title" content="Join the Brand.UP creative network">
  <meta property="og:description" content="Freelance branding & art direction: apply in 3 steps.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,800;6..12,900&display=swap">
  <link rel="stylesheet" href="style.css?v=202610261544">
  <script src="config.js?v=202610261544"></script>
  <script src="verrou.js?v=202610261544"></script>
</head>
<body>

  <header class="bandeau">
    <div class="bandeau__langues" data-langues></div>
    <p class="bandeau__titre" data-t="bandeau.titre"></p>
    <p class="bandeau__sous">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      <span data-t="bandeau.sousTitre"></span>
      <svg class="miroir" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </p>
  </header>
  <ol class="etapes" data-etapes="1" aria-label="Application steps"></ol>

  <main>
    <img src="assets/logo-rose.png" alt="Brand.UP" width="260" height="74" style="width:260px">

    <h1 class="titre-hero"><span data-t="page1.titreDebut"></span><span class="surligne" data-t="page1.titreSurligne"></span><span data-t="page1.titreFin"></span></h1>


    <ul class="badges" data-liste="page1.badges"></ul>

    <div class="fleches" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <div class="carte-form" id="formulaire">
      <p class="carte-form__titre" data-t="page1.formTitre"></p>
      <div class="cadre-tally">
        <img class="cadre-tally__logo" src="assets/icon-up.png" alt="" width="64" height="64">
        <div data-tally="tallyContactId" data-suite="presentation.html" data-hauteur="430" data-titre="Contact form"></div>
      </div>
      <p class="mention" data-t="page1.formMention"></p>
    </div>

    <section class="max-1100" style="display:flex;flex-direction:column;align-items:center;gap:36px">
      <h2 class="titre-section">
        <span data-t="page1.temoignagesTitre"></span>
      </h2>
      <p class="sous-titre-section" data-t="page1.temoignagesSousTitre"></p>
      <ul class="temoignages" data-temoignages="page1.temoignages"></ul>
      <a class="bouton" href="#formulaire"><span data-t="page1.boutonHaut"></span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </a>
    </section>
  </main>

  <footer class="pied">
    <div class="pied__contenu">
      <div class="pied__ligne">
        <img class="pied__logo" src="assets/logo-blanc-tagline.png" alt="Brand.UP — Build. Upgrade. Perform." width="150" height="58">
        <nav aria-label="Footer links">
          <a href="legal-notice.html" data-t="footer.mentions"></a>
          <a href="privacy.html" data-t="footer.confidentialite"></a>
        </nav>
        <div class="reseaux">
          <a href="#" data-social="linkedinUrl" target="_blank" rel="noopener" aria-label="LinkedIn"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.1c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V21h-4z"/></svg></a>
          <a href="#" data-social="instagramUrl" target="_blank" rel="noopener" aria-label="Instagram"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
        </div>
      </div>
      <div class="avertissement">
        <strong data-t="footer.avertissementTitre"></strong>
        <p data-t="footer.avertissement"></p>
      </div>
    </div>
  </footer>

  <script src="textes.js?v=202610261544"></script>
  <script src="site.js?v=202610261544"></script>
</body>
</html>
